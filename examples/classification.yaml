dataset: ../data/test_classification_with_nulls.csv
target: churned
task: classification
scorer: aucpr
positive_class: "yes"
predictors: [age, monthly_spend, tenure, support_calls, region]
algorithms: [xgboost]
n_folds: 3
n_trials: 20
seed: 42
output_dir: ../runs/classification
output_format: csv
explain_sample_size: 80
n_jobs: 2

# Optional regression target transformation (ignored for classification).
# target_transform: none      # none | log | sqrt | cbrt (regression only)

# Feature selection / iterative optimization (optional):
# iterations: 2
# feature_selection: true
# feature_selection_trials: 20
# max_selected_features: 4

# Round1b: importance-based backward elimination (optional).
# round1b_iterations: 1   # 0 disables; 1 (default) iter1 only; N>1 first N iters
# Optional wall-clock budget for the whole iterative optimization.
# After each iteration completes, the elapsed run time is checked against
# this value and the remaining iterations are skipped (current best kept).
# max_run_seconds: 3600
# Bottom-up variable reduction (optional, iteration 1 only).
# bottom_up_variable_reduction: false
# bottom_up_n_trials: 20          # round1 trials in iteration 1 (default: n_trials)
# bottom_up_importance_threshold: 0.01   # fixed threshold; unset -> dynamic (1/n_predictors)/2

# Multimodel variable reduction (optional, runs once before iteration 1).
# multimodel_variable_reduction: false
# multimodel_n_models: 10
# multimodel_variable_appearances: 3
# multimodel_exclude_bottom: 0.1       # int count or float 0 < x < 1 fraction
# multimodel_top_k: 15
