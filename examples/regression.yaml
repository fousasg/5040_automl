dataset: ../data/test_regression_with_nulls.csv
target: target
task: regression
scorer: rmse
predictors: [age, income, tenure, region, noise]
algorithms: [xgboost]
n_folds: 4
n_trials: 10
seed: 42
output_dir: ../runs/regression
output_format: csv
explain_sample_size: 80
n_jobs: -1

# Monotonicity constraints (optional):
# 1 = monotonically increasing, -1 = monotonically decreasing
# Only numeric predictors can be constrained.
monotonicity_constraints:
  tenure: 1

# Feature selection / iterative optimization (optional):
iterations: 10
refine_factor: 0.9        # narrow round1 search space by 10% each iteration
feature_selection: true
feature_selection_trials: 10
max_selected_features: 3

# Round1b: importance-based backward elimination (optional).
# Number of iterations (from iteration 1) in which round1b runs.
#   0 disables it; 1 (default) runs only in iteration 1; N>1 runs first N.
# Features dropped by round1b are permanently removed from round2's pool.
round1b_iterations: 1

# Bottom-up variable reduction (optional, iteration 1 only).
# Fits the best model, drops predictors with importance below
# bottom_up_importance_threshold, and uses that survivor model as the
# starting point (anchor) of round2. Dropped predictors stay
# available in round2's candidate pool.
bottom_up_variable_reduction: false
bottom_up_n_trials: 20         # round1 trials in iteration 1 (default: n_trials)
bottom_up_importance_threshold: 0.01   # drop importance < 1% (normalized)

