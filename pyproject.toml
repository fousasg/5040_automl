[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-xgboost-optuna"
version = "0.1.0"
description = "XGBoost AutoML optimization with Optuna and SHAP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "xgboost>=2.1,<4",
  "shap>=0.46,<1",
  "optuna>=4,<5",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.7,<3",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<22",
  "PyYAML>=6,<7",
  "plotly>=5.20,<7",
  "matplotlib>=3.8,<4",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
automl-xgboost = "automl_xgboost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: executes real XGBoost and SHAP end-to-end runs"]

